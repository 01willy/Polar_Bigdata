# Project config for skills (cleanup/handoff/status/collect/start-session/gpu-check)
project_name: polar_bigdata
display_name: Polar Bigdata — Permafrost ALT map + shallow 3D thermal (DL)
working_dir: /home/willy010313/Polar_Bigdata

# GPU policy
gpu_default: [6, 7, 8, 9]
gpu_strict: false        # user often specifies exact GPUs; latest instruction wins
process_name: Polar_Bigdata

# Status / collect scripts (relative to working_dir) — 아직 없음
status_script: null
collect_script: null

# Tracked artifacts
session_handoff: SESSION_HANDOFF.md
experiment_log: docs/EXPERIMENT_LOG.md
research_plan: null

# GPT collaboration
gpt_handoff_dir: gpt/handoff/
legacy_handoff_dirs: []

# Git
git_main_branch: main
gitignore_required: ["*.pt", "*.pth", "*.ckpt", "*.parquet", "*.npy", "*.npz",
                     "data/raw/", "data/interim/", "outputs/models/",
                     "references/*.pdf", "__pycache__/"]
active_phase_paths: []

# Reports
authoritative_reports_dir: outputs/report/   # 주 제출물 main.tex → main.pdf

# Naming canonical
naming_canonical: |
  실험 단계 명칭(현행, scripts/3_deep_learning/s*.py):
    S1 기준선 7모델 · S2 물리식 5종 비교 · S3 유사라벨 증강 반응곡선 · S4 물리 잔차 결합(λ)
    S6 다중충실도 · S7 KPDC 현장검증 · S8 혼합 모델 · S10 표층 3D 온도장
    S11 보정 예측구간(CQR)+AOA · S12 물리+위성 앵커 결합 · S14 연별 ALT (S13 통합실험 폐기)
  폐기 이력(참고): B0/B0b/B1/B1b(신경장 킬스위치), tournament(6모델), curated(12.97cm=범위축소 아티팩트, "SOTA 돌파" 아님)
  공변량 집합(정본 src/polar/fidelity.py:19-38):
    전체 34 = 지형6(dem_) + 기후8(e5_ ERA5-Land) + 토양9(sg_ SoilGrids) + SAR8(InSAR5+PolSAR3) + CCI2 + 결측표시1
    전이 공통 25 = 34 − SAR8 − 표시1 (SAR는 알래스카에서만 유효)
    지형기후 14 = 지형6 + 기후8 (물리식·증강 비교용) · 광역격자 17 = 기후8 + 토양9 (지도 산출용)
    연별 9 = 기후8의 연별판(e5t_) + 전겨울 적설수당량
  검증 3조건(표 tab:settings): 지역 내 / 공변량만 / 정보 없음(LORO). 조건이 다른 수치는 같은 축에서 비교 금지.
  용어 정본: 물리 잔차 결합 · 위성 제품(ESA CCI) · 레나델타 · 증강 비율 r · 활동층(ALT)
  산출 폴더: outputs/{figures,maps,volumes_3d,animations,models}/
  핵심 수치는 항상 data/processed/*_results.csv 근거와 함께 인용. 알래스카 13,606셀 = 0.5° 블록 74개.
