# v6c: 라벨 수 사다리 LL·TL(관측일 정합, CatBoost). 2026-10-15. 묶음: bash scripts/rescale/make_payload_v6c.sh
name: polar-v6c-ladder
hardware:
  core_type: elm
  cores_per_slot: 96
  slots: 1
  walltime_hours: 4
max_cost_usd: 14
low_priority: false
analysis:
  code: pytorch
  version: "2.4.1"
code_paths:
  - work/v6c_payload.tar.gz
dataset_file_ids: []
command: |
  [ -f v6c_payload.tar.gz ] && tar xzf v6c_payload.tar.gz; V6_JOB=ladder V6_BUDGET_MIN=225 bash scripts/rescale/run_v6c.sh
results_dir: results/rescale_v6_ladder
