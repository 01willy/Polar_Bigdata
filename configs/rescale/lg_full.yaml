# LG(H40) 본 실행. 계획 docs/EXPERIMENT_PLAN_LG_2026-09-29.md §1–§6.
# CPU 부분(CatBoost·ridge)과 GPU 부분(신경망·생성 모델 학습기)을 한 작업 안에서 함께 실행한다(사용자 지시 2026-09-29).
#
# 선행 조건: lg_smoke.yaml 작업이 통과하고 학습기별 시간 환산(lg_smoke_full_projection.csv)을 확인한 뒤 제출한다.
# 묶음 작성:   bash scripts/rescale/make_payload.sh
# 제출 전 확인: python3 tools/rescale_client.py run configs/rescale/lg_full.yaml --dry-run
# 제출:        python3 tools/rescale_client.py run configs/rescale/lg_full.yaml --yes --no-wait
#
# 비용: iolite-4 는 64코어 × 0.0890 달러/코어·시간 = 5.70 달러/시간. 벽시계 22 h 기준 최악 125.31 달러.
# 과금은 실제 사용 시간 기준이다. 스크립트는 21.25 h 에 맞춰 스스로 끝난다(LG_BUDGET_MIN).
# 범위: 사전 등록 범위 전부(CPU 부분 + GPU 학습기 7종, RealMLP 의 R2 포함). 사용자 지시(2026-09-29): 비용보다 범위의 완전성을 우선한다.
# 벽시계 근거: 사전 점검(qOkSo) 실측 환산으로 GPU 누적 171.5 h(6종 73.1 + RealMLP 98.4), 워커 12개 약 14.3 h, 집계 포함 약 15–16 h 다
# (계획서 §6.1). 환산의 불확실성을 고려해 상한을 22 h 로 둔다. RealMLP 는 맨 뒤에 실행된다.

name: polar-lg-full

hardware:
  core_type: iolite-4        # GPU 4장(T4). 허용 코어 수 64 (coretypes --gpu-only, 2026-09-29 확인)
  cores_per_slot: 64
  slots: 1
  walltime_hours: 22

max_cost_usd: 130
low_priority: false          # 선점형 등급은 쓰지 않는다(프로젝트 방침)

analysis:
  code: pytorch
  version: "2.4.1"

code_paths:
  - work/lg_payload.tar.gz

# 이어서 실행할 때: 이전 작업의 results_lg.tar.gz 를 results_lg_prev.tar.gz 로 이름을 바꿔 올리고(rescale_client.py upload)
# 그 파일 id 를 여기에 넣는다. run_lg.sh 가 조각을 복원하고 --resume 이 끝난 작업 단위를 건너뛴다.
dataset_file_ids: []

# 환경 변수는 scripts/rescale/run_lg.sh 상단에 설명이 있다.
command: |
  [ -f lg_payload.tar.gz ] && tar xzf lg_payload.tar.gz; LG_GPU_LEARNERS=all LG_BUDGET_MIN=1275 bash scripts/rescale/run_lg.sh

results_dir: results/rescale_lg
