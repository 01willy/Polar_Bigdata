# WF 3차 보강(WF9·WF10, H54) 본 실행(hematite 판). 계획 docs/EXPERIMENT_PLAN_WF_2026-10-01.md §7.
# 2026-10-02 01:25: elm 판(wf3_full.yaml, 작업 oCvpT)이 60분 동안 노드를 받지 못해(Started → Pending 두 번) 실행 전에 멈추고 이 설정으로 다시 제출한다.
# hematite 는 WF6 를 돌린 elm 과 같은 AMD Milan 계열이다(WF9 의 WF6 재현 대조). 64코어 × 0.0659 = 4.22 달러/시간, 워커 14개 × 4스레드.
# 실험 wf9(지역 내 격자 안 분해, 분할 1–25), wf9x(전이 격자 안 분해, 주 4지역 + 알래스카 모드 x), wf10(따뜻한·추운 블록 외삽, 분할 1–10)을
# 한 작업에서 돌리고 끝에 집계(재표집 10,000회, 표 data/processed/wf/wf3b_*)까지 한다. 한 작업 안에서 한 플랫폼만 쓴다(계획서 §1).
#
# 스모크: 2차 스모크(QmToeb)와 같은 묶음 구성·환경이고 새 의존성이 없어 Rescale 스모크를 생략했다. 로컬 스모크와 단위 시험은 통과했다(개정 이력 2026-10-02).
# 묶음 작성:   bash scripts/rescale/make_payload_wf.sh
# 제출 전 확인: python3 tools/rescale_client.py run configs/rescale/wf3_full.yaml --dry-run
# 제출:        python3 tools/rescale_client.py run configs/rescale/wf3_full.yaml --yes --no-wait
#
# 노드: elm(AMD EPYC Milan 96코어, GPU 없음), 0.0337 달러/코어·시간 × 96 = 3.24 달러/시간. 워커 22개 × 4스레드(run_wf.sh 기본).
#
# 벽시계 근거(추정, 2026-10-02)
#   --count-only(로컬, --exp wf9,wf9x,wf10): 작업 단위 129(wf9 74, wf9x 25, wf10 30; 건너뜀 11), 적합 14,818건, 크리깅 587회,
#   추정 누적 1.27 CPU-h(4스레드 프로세스 기준; wf9 0.35, wf9x 0.78, wf10 0.14). 2차 실측/추정 비 0.66 을 적용하면 0.84 CPU-h, 워커 22개면
#   약 0.05 h 다. 감속 1.5배, 설치 0.1 h, 집계 약 0.2 h(2차 본 실행 OUZBT 는 실행과 집계를 합쳐 6분이었다)를 더해 약 0.4 h, 약 1.3 달러로 본다.
#   상한은 2 h(최악 8.44 달러, max_cost_usd 9, 20 달러 미만). 워커가 14개라 실행은 elm 판의 약 1.6배 걸린다. 스크립트는 105분에 맞춰 스스로 끝나고 실행은 그보다 40분 앞서 멈춘다(집계 예비).

name: polar-wf3-full-hm

hardware:
  core_type: hematite        # GPU 없음, x86(AMD EPYC 7V73X Milan-X). 허용 코어 수 [64]. elm 미배정으로 교체(머리 주석)
  cores_per_slot: 64
  slots: 1
  walltime_hours: 2

max_cost_usd: 9
low_priority: false          # 선점형 등급은 쓰지 않는다(프로젝트 방침)

analysis:
  code: pytorch
  version: "2.4.1"

code_paths:
  - work/wf_payload.tar.gz

dataset_file_ids: []

command: |
  [ -f wf_payload.tar.gz ] && tar xzf wf_payload.tar.gz; WF_MODE=full WF_EXPS=wf9,wf9x,wf10 WF_BUDGET_MIN=105 WF_SUM_RESERVE_MIN=40 bash scripts/rescale/run_wf.sh

results_dir: results/rescale_wf3
