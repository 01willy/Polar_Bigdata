# LG(H40) 스모크·사전 점검 작업. 계획 docs/EXPERIMENT_PLAN_LG_2026-09-29.md §6.
#
# 목적: 본 실행(lg_full.yaml) 전에 가장 싼 GPU 노드에서 환경·의존성·코드 경로를 확인하고 학습기별 적합 시간을 잰다.
#   h40 --smoke(cpu 부분, gpu 부분 GPU 1장) → 집계 → 단위 시험(tests/test_h40_smoke.py) → 남은 시간에 사전 점검(--precheck)
#
# 묶음 작성:   bash scripts/rescale/make_payload.sh
# 제출 전 확인: python3 tools/rescale_client.py run configs/rescale/lg_smoke.yaml --dry-run
# 제출:        python3 tools/rescale_client.py run configs/rescale/lg_smoke.yaml --yes --no-wait
#
# 비용: iolite-1 은 4코어 × 0.1721 달러/코어·시간 = 0.69 달러/시간. 벽시계 2 h 기준 최악 1.38 달러.
# 과금은 실제 사용 시간 기준이다. 스크립트는 시작 110분에 맞춰 스스로 끝난다(LG_SMOKE_BUDGET_MIN).
# 벽시계를 2 h 로 둔 이유: 사전 점검(학습기 6종 + RealMLP 시간 측정)의 추정 소요가 T4 에서 0.6–0.9 h 라 1 h 안에 끝나지 않는다.

name: polar-lg-smoke

hardware:
  core_type: iolite-1        # GPU 1장(T4). 허용 코어 수 4 (coretypes --gpu-only, 2026-09-29 확인)
  cores_per_slot: 4
  slots: 1
  walltime_hours: 2

max_cost_usd: 3
low_priority: false          # 선점형 등급은 쓰지 않는다(프로젝트 방침)

analysis:
  code: pytorch
  version: "2.4.1"

code_paths:
  - work/lg_payload.tar.gz

dataset_file_ids: []

# 환경 변수는 scripts/rescale/run_lg_smoke.sh 상단에 설명이 있다.
command: |
  [ -f lg_payload.tar.gz ] && tar xzf lg_payload.tar.gz; LG_SMOKE_BUDGET_MIN=110 LG_SMOKE_PRECHECK=1 bash scripts/rescale/run_lg_smoke.sh

results_dir: results/rescale_lg_smoke
