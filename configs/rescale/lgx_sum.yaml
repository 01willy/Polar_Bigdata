# LGX 통합 집계 작업. 계획 docs/EXPERIMENT_PLAN_LG_2026-09-29.md §6A.6, §6A.8.
# CPU 작업(lgx_cpu.yaml)과 GPU 작업(lgx_gpu.yaml)의 조각, 본 실행(LG, 작업 ZovWo)의 조각을 한곳에 풀어 h42 와 h41 의 집계를 다시 돌린다.
# 학습을 하지 않는다. 재현 점검(lgx_gate.csv)은 본 실행의 cpu 조각 117 단위와 대조하고, X6(L26, L27)은 본 실행의 분할 1–3 과 확장의
# 분할 4–5 를 합쳐 판정한다. 등록한 재표집 횟수(10,000회)의 집계는 로컬에서 하지 않으므로 이 작업이 최종 집계다.
#
# 선행 조건: 아래 세 묶음을 올리고 파일 id 를 dataset_file_ids 에 넣는다(id 가 비어 있으면 집계할 조각이 없어 종료 코드 1 로 끝난다).
#   python3 tools/rescale_client.py upload results/rescale_lg/results_lg.tar.gz results/rescale_lgx_cpu/results_lgx_cpu.tar.gz \
#           results/rescale_lgx_gpu/results_lgx_gpu.tar.gz
#   GPU 작업을 둘로 나눴으면 results_lgx_gpu_rm.tar.gz 도 넣는다. 묶음 이름은 바꾸지 않는다(run_lgx.sh 가 이름으로 종류를 가린다).
# 제출 전 확인: python3 tools/rescale_client.py run configs/rescale/lgx_sum.yaml --dry-run
# 제출:        python3 tools/rescale_client.py run configs/rescale/lgx_sum.yaml --yes --no-wait
#
# 노드: hematite(lgx_cpu.yaml 과 같다). 4.22 달러/시간, 벽시계 2 h 기준 최악 8.44 달러.
# 벽시계 근거(추정): h42 집계 0.3 h(곡선 약 3만 행, 재표집 10,000회, 프로세스 14개. 재지 않았다), h41 집계 0.1 h(재지 않았다),
#   설치와 복원 0.15 h, 합계 0.55 h. 여유 40 % 를 더하면 0.77 h 다. 집계 시간을 재지 않았으므로 상한을 2 h 로 둔다.
#   스크립트는 1.67 h 에 맞춰 스스로 끝난다(LGX_BUDGET_MIN=100). CPU 작업 끝의 집계 시간(lgx_cpu_status.csv 의 summarize_h42 행)을 본 뒤
#   이 상한을 다시 정한다.
# 결과 묶음 results_lgx_sum.tar.gz 에는 집계 표와 로그만 넣는다(조각은 입력 묶음에 있다).

name: polar-lgx-sum

hardware:
  core_type: hematite        # GPU 없음, x86(AMD EPYC 7V73X). 허용 코어 수 [64] (coretypes 조회 2026-09-29)
  cores_per_slot: 64
  slots: 1
  walltime_hours: 2

max_cost_usd: 10
low_priority: false          # 선점형 등급은 쓰지 않는다(프로젝트 방침)

analysis:
  code: pytorch
  version: "2.4.1"

code_paths:
  - work/lgx_payload.tar.gz

# 본 실행 묶음(results_lg.tar.gz), 확장 CPU 묶음(results_lgx_cpu.tar.gz), 확장 GPU 묶음(results_lgx_gpu.tar.gz)의 파일 id.
dataset_file_ids: []

# 환경 변수는 scripts/rescale/run_lgx.sh 상단에 설명이 있다. LGX_PARTS 가 빈 문자열이면 실행 없이 복원과 집계만 한다.
command: |
  [ -f lgx_payload.tar.gz ] && tar xzf lgx_payload.tar.gz; LGX_PARTS="" LGX_LABEL=sum LGX_SUMMARIZE=1 LGX_PACK_SHARDS=0 LGX_BUDGET_MIN=100 bash scripts/rescale/run_lgx.sh

results_dir: results/rescale_lgx_sum
