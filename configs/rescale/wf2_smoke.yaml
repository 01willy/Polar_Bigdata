# WF 2차 보강(WF6–WF8, H54) 스모크·사전 점검 작업. 계획 docs/EXPERIMENT_PLAN_WF_2026-10-01.md §6(스모크 뒤 본 실행, 비용은 스모크 실측으로 다시 적는다).
#
# 목적: 본 실행(wf2_full.yaml) 전에 같은 노드 종류(elm)에서 wf6·wf7·wf8 경로와 단위 시험을 확인하고 적합 시간을 잰다.
#   h54 --smoke --exps wf6,wf7,wf8(대상 축소: wf6 캐나다 새 분할 6, wf7 러시아 W·AL-3(모드 i) n {0, 10, 전량}, wf8 러시아 W·캐나다 S1·S2·S4)
#   → 단위 시험(tests/test_h54_workflow.py, LG_RUN_HEAVY=1, 1차·2차 보강 시험 모두) → 본 실행 범위의 적합 수 표(--count-only, wf2b_count.csv)
#   → 사전 점검(--precheck: wf6 알래스카 분할 1, wf7 알래스카 x·레나 x, wf8 알래스카 x 의 S1·S4) → 실측/추정 비로 본 실행 환산.
#   이 작업의 산출은 경로 확인과 시간 측정용이다. 가설 판정에 쓰지 않는다.
#
# 묶음 작성:   bash scripts/rescale/make_payload_wf.sh   (커밋 뒤. 묶음은 1차와 같은 파일 work/wf_payload.tar.gz 이다)
# 제출 전 확인: python3 tools/rescale_client.py run configs/rescale/wf2_smoke.yaml --dry-run
# 제출:        python3 tools/rescale_client.py run configs/rescale/wf2_smoke.yaml --yes --no-wait   (사용자 확인 뒤)
#
# 노드: elm(AMD EPYC Milan 96코어, GPU 없음, 0.0337 달러/코어·시간 × 96 = 3.24 달러/시간). 1차(nyFtT, xQyfeb)와 같은 노드 종류다.
# 비용: 벽시계 상한 1 h → 최악 3.24 달러(max_cost_usd 4). 과금은 실제 사용 시간 기준이다.
# 벽시계 근거(추정): 설치 5분 · 스모크 1분 이하(로컬 2스레드 실측 23초, 2026-10-01) · 단위 시험 약 3–4분(로컬 2스레드 실측: 가벼운 시험 55초,
#   통합 시험 2개 135초) · 적합 수 표 1분 이하(로컬 실측 26초) · 사전 점검 대표 단위 5개 병렬 약 2분(가장 긴 단위 wf7 알래스카 x, 추정 약 1분)
#   · 환산 1분. 합계 약 15분. 스크립트는 시작 50분에 맞춰 스스로 끝난다(WF_BUDGET_MIN).

name: polar-wf2-smoke

hardware:
  core_type: elm             # GPU 없음, x86(AMD EPYC Milan). 허용 코어 수 [96] (coretypes 조회 2026-10-01)
  cores_per_slot: 96
  slots: 1
  walltime_hours: 1

max_cost_usd: 4
low_priority: false          # 선점형 등급은 쓰지 않는다(프로젝트 방침)

analysis:
  code: pytorch              # 1차와 같은 이미지(python 3.11). WF 는 torch 를 쓰지 않는다
  version: "2.4.1"

code_paths:
  - work/wf_payload.tar.gz

dataset_file_ids: []

# 환경 변수는 scripts/rescale/run_wf.sh 상단에 설명이 있다. WF_EXPS 를 2차 보강 실험으로 고정한다.
command: |
  [ -f wf_payload.tar.gz ] && tar xzf wf_payload.tar.gz; WF_MODE=smoke WF_EXPS=wf6,wf7,wf8 WF_BUDGET_MIN=50 bash scripts/rescale/run_wf.sh

results_dir: results/rescale_wf2_smoke
