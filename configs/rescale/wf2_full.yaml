# WF 2차 보강(WF6–WF8, H54) 본 실행. 계획 docs/EXPERIMENT_PLAN_WF_2026-10-01.md §6.
# 실험 wf6(지역 내 검정력 보강, 분할 1–25), wf7(Stefan·CCI 평균 앵커의 전이, LG 27 (대상, 모드)), wf8(전이 조건 라벨 위치, 전략 S1·S2·S4)을
# 한 작업에서 돌리고 끝에 집계(재표집 10,000회, 표 data/processed/wf/wf2b_*)까지 한다. 한 작업 안에서 한 플랫폼만 쓴다(계획서 §1).
#
# 선행 조건: wf2_smoke.yaml 작업이 통과하고(단위 시험 포함) 시간 환산(wf_smoke_projection.csv)을 확인한 뒤 제출한다.
#   환산이 아래 추정보다 크게 나오면 walltime_hours, max_cost_usd, WF_BUDGET_MIN 을 다시 정하고 계획서 개정 이력에 적는다.
# 묶음 작성:   bash scripts/rescale/make_payload_wf.sh
# 제출 전 확인: python3 tools/rescale_client.py run configs/rescale/wf2_full.yaml --dry-run
# 제출:        python3 tools/rescale_client.py run configs/rescale/wf2_full.yaml --yes --no-wait   (사용자 확인 뒤)
#
# 노드: elm(AMD EPYC Milan 96코어, GPU 없음), 0.0337 달러/코어·시간 × 96 = 3.24 달러/시간(coretypes 조회 2026-10-01). 워커 22개 × 4스레드
#   (run_wf.sh 기본: (코어 − 8)/4).
#
# 벽시계 근거(추정, 2026-10-01)
#   --count-only(로컬, --exp wf6,wf7,wf8): 작업 단위 266(wf6 74, wf7 117, wf8 75), 적합 25,822건(wf6 13,270, wf7 11,356, wf8 1,196),
#   크리깅 3,445회, 추정 누적 2.05 CPU-h(4스레드 프로세스 기준; wf6 0.67, wf7 1.24, wf8 0.14), 가장 긴 단위 추정 0.02 h.
#   1차 Rescale 스모크(nyFtT)의 실측/추정 비 0.62 를 적용하면 1.27 CPU-h, 워커 22개면 약 0.06 h 다(로컬 2스레드 스모크의 비는
#   2차 보강 1.36, 1차 1.5–3 이었다. 비가 1차 최악값 0.88 이어도 약 0.08 h). CatBoost 과다 구독의 감속 1.5배를 더해 실행 약 0.1 h,
#   설치 0.1 h, 집계 약 0.2–0.3 h(재지 않았다. wf6 은 분할 25개라 대비마다 재표집이 1차의 5배다)로 합계 약 0.5 h, 예상 비용 약 1.6 달러다.
#   상한은 약 4배인 2 h 로 둔다(최악 6.48 달러, max_cost_usd 7, 20 달러 미만). 스크립트는 105분에 맞춰 스스로 끝나고(WF_BUDGET_MIN 105)
#   실행은 그보다 40분 앞서 멈춘다(집계 예비). 시간 한도로 중단되면 결과 묶음을 results_wf_prev.tar.gz 로 올려 다시 제출한다
#   (--resume 이 끝난 조각을 건너뛴다).

name: polar-wf2-full

hardware:
  core_type: elm             # GPU 없음, x86(AMD EPYC Milan). 허용 코어 수 [96] (coretypes 조회 2026-10-01)
  cores_per_slot: 96
  slots: 1
  walltime_hours: 2

max_cost_usd: 7
low_priority: false          # 선점형 등급은 쓰지 않는다(프로젝트 방침)

analysis:
  code: pytorch
  version: "2.4.1"

code_paths:
  - work/wf_payload.tar.gz

# 이어서 실행할 때: 이전 작업의 results_wf.tar.gz 를 results_wf_prev.tar.gz 로 이름을 바꿔 올리고(rescale_client.py upload) 그 파일 id 를 넣는다.
dataset_file_ids: []

# 환경 변수는 scripts/rescale/run_wf.sh 상단에 설명이 있다. WF_EXPS 를 2차 보강 실험으로 고정한다.
command: |
  [ -f wf_payload.tar.gz ] && tar xzf wf_payload.tar.gz; WF_MODE=full WF_EXPS=wf6,wf7,wf8 WF_BUDGET_MIN=105 WF_SUM_RESERVE_MIN=40 bash scripts/rescale/run_wf.sh

results_dir: results/rescale_wf2
