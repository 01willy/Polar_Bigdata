# LGX 본 실행의 GPU 작업: h42 의 gpu 부분(축 r0, g45, nn). 계획 docs/EXPERIMENT_PLAN_LG_2026-09-29.md §6A.
# 항목: X6(분할 4·5 의 D0·R1·R2 × 학습기 7종과 MLP α 축, R0 × 학습기 6종), X1 의 신경망(F1k, V2, RM × mlp, tabm, ftt).
# 학습기는 사전 등록 범위 전부(7종, RealMLP 포함)다. 실행 순서는 빠른 학습기가 먼저고 RealMLP 가 맨 뒤다.
#
# 선행 조건: lgx_smoke.yaml 작업이 통과하고 시간 환산(lgx_smoke_full_projection.csv)을 확인한 뒤 제출한다.
# 묶음 작성:   bash scripts/rescale/make_payload_lgx.sh
# 제출 전 확인: python3 tools/rescale_client.py run configs/rescale/lgx_gpu.yaml --dry-run
# 제출:        python3 tools/rescale_client.py run configs/rescale/lgx_gpu.yaml --yes --no-wait
#
# 노드: iolite-4(64코어, T4 4장, AMD EPYC 7V12). 본 실행(LG, 작업 ZovWo)과 같다. X6 은 본 실행의 분할 1–3 조각과 이 작업의 분할 4–5 조각을
#   합쳐 판정하므로 노드 종류를 같게 둔다. 0.0890 달러/코어·시간 × 64코어 = 5.70 달러/시간. 벽시계 20 h 기준 최악 113.92 달러.
#
# 벽시계 근거(추정. 적합 수는 --count-only 값, 시간은 그 추정에 계획서 §6.1 의 학습기별 비(실측 환산 / 개정 1 추정)를 곱한 값이다)
#   작업 단위 649, 적합 19,082건. g45 113.4 · r0 22.0 · nn 20.5 GPU-h, 합계 155.9 GPU-h.
#   RealMLP 77.8 GPU-h, 나머지 6종 78.0 GPU-h(그 가운데 FT-Transformer 62.1 GPU-h).
#   워커 12개(GPU 4장 × 프로세스 3개)에서 155.9 / 12 = 13.0 h. 여유 40 %: 13.0 × 1.4 = 18.2 h.
#   설치 0.15 h(pytabkit 포함, qOkSo 실측 4분), 시간 표와 묶음 0.3 h, 끝 여유 0.75 h 를 더하면 19.4 h 다. 올림해 20 h 로 둔다.
#   스크립트는 19.25 h 에 맞춰 스스로 끝난다(LGX_BUDGET_MIN=1155). 실행 구간의 한도는 약 18.8 h(추정의 1.45배)다.
#   시간이 모자라 중단되면 결과 묶음을 입력으로 넣어 다시 제출한다(--resume 이 끝난 조각을 건너뛴다. 조각은 학습기 단위다).
#   재지 않은 값: RealMLP 는 epoch 8 실측을 256 으로 환산한 값이라 과대일 수 있다. T4 4장 노드의 실제 처리량, 새 방법(F1k, V2, RM)의
#   신경망 적합 시간은 재지 않았다. lgx_smoke.yaml 작업의 환산을 본 뒤 이 상한을 다시 정한다.
#   예상 비용은 13.0 h 에 설치와 묶음 0.4 h 를 더한 약 13.4 h, 약 76달러다.
#
# 둘로 나눠 함께 제출할 수도 있다(합계 비용은 같고 끝나는 시각이 앞당겨진다). command 의 LGX_GPU_LEARNERS 와 LGX_LABEL 만 바꾼다.
#   6종: LGX_GPU_LEARNERS=mlp,cfm,ddpm,tabm,nflow,ftt LGX_LABEL=gpu   (78.0 / 12 = 6.5 h, 여유 40 % 와 부대 시간을 더해 상한 11 h)
#   RealMLP: LGX_GPU_LEARNERS=realmlp LGX_LABEL=gpu_rm               (77.8 / 12 = 6.5 h, 상한 11 h)
#
# 집계는 이 작업에서 하지 않는다(LGX_SUMMARIZE=0). 가설 판정은 CPU 작업의 조각과 본 실행 조각이 함께 있어야 하므로 lgx_sum.yaml 에서 한다.

name: polar-lgx-gpu

hardware:
  core_type: iolite-4        # GPU 4장(T4). 허용 코어 수 [64] (coretypes 조회 2026-09-29)
  cores_per_slot: 64
  slots: 1
  walltime_hours: 20

max_cost_usd: 120
low_priority: false          # 선점형 등급은 쓰지 않는다(프로젝트 방침)

analysis:
  code: pytorch
  version: "2.4.1"

code_paths:
  - work/lgx_payload.tar.gz

# 이어서 실행할 때: 이전 작업의 results_lgx_gpu.tar.gz 를 올리고(rescale_client.py upload) 그 파일 id 를 여기에 넣는다.
dataset_file_ids: []

# 환경 변수는 scripts/rescale/run_lgx.sh 상단에 설명이 있다.
command: |
  [ -f lgx_payload.tar.gz ] && tar xzf lgx_payload.tar.gz; LGX_PARTS="gpu" LGX_LABEL=gpu LGX_GPU_LEARNERS=all LGX_SUMMARIZE=0 LGX_BUDGET_MIN=1155 LGX_SUM_RESERVE_MIN=20 bash scripts/rescale/run_lgx.sh

results_dir: results/rescale_lgx_gpu
